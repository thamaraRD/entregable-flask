
{% extends "base.html" %}

{% block contenido %}
<div class="tarjeta">
    <h1>Formulario de Notas</h1>

    <form method="POST">
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" name="nota1"
               min="10" max="70" step="any" required>

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" name="nota2"
               min="10" max="70" step="any" required>

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" name="nota3"
               min="10" max="70" step="any" required>

        <label for="asistencia">Asistencia (%):</label>
        <input type="number" id="asistencia"
               name="asistencia" min="0" max="100"
               step="any" required>

        <button type="submit">Enviar</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if resultado %}
        <div class="resultado">
            <p>Promedio: {{ resultado.promedio }}</p>
            <p class="{{ 'aprobado' if resultado.estado == 'APROBADO'
                         else 'reprobado' }}">
                {{ resultado.estado }}
            </p>
        </div>
    {% endif %}

    <a class="volver" href="{{ url_for('inicio') }}">
        Volver al menú
    </a>
</div>
{% endblock %}
