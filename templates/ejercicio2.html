
{% extends "base.html" %}

{% block contenido %}
<div class="tarjeta">
    <h1>Comparador de Nombres</h1>

    <form method="POST">
        <label for="nombre1">Nombre 1:</label>
        <input type="text" id="nombre1"
               name="nombre1" required>

        <label for="nombre2">Nombre 2:</label>
        <input type="text" id="nombre2"
               name="nombre2" required>

        <label for="nombre3">Nombre 3:</label>
        <input type="text" id="nombre3"
               name="nombre3" required>

        <button type="submit">Enviar</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if resultado %}
        <div class="resultado">
            <p>Nombre con más letras:
               <strong>{{ resultado.nombre }}</strong>
            </p>
            <p>Cantidad de caracteres:
               {{ resultado.cantidad }}
            </p>
        </div>
    {% endif %}

    <a class="volver" href="{{ url_for('inicio') }}">
        Volver al menú
    </a>
</div>
{% endblock %}
